<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Inversion Tool</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111418">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inversion">
<style>
  :root {
    --bg: #111418;
    --panel: #1a1f25;
    --border: #2a323c;
    --text: #e6edf3;
    --muted: #8b97a3;
    --accent: #4aa3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-left: auto;
  }
  button, select, input[type="file"]::file-selector-button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: progress; }
  button.primary {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    font-weight: 600;
  }
  input[type="file"] {
    color: var(--muted);
    font-size: 13px;
  }
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 16px;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .panel h2 {
    margin: 0 0 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .canvas-wrap {
    position: relative;
    width: 100%;
    background: #0a0d11;
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 200px;
  }
  canvas {
    display: block;
    max-width: 100%;
    height: auto;
    touch-action: none;
  }
  #leftCanvas { cursor: crosshair; }
  #rightCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-origin: 0 0;
    cursor: grab;
  }
  #rightCanvas.grabbing { cursor: grabbing; }
  #rightOverlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-origin: 0 0;
    pointer-events: none;
  }
  .view-controls {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 8px;
  }
  .view-controls button {
    font-size: 12px;
    padding: 5px 10px;
  }
  .view-controls .zoom-label {
    font-size: 12px;
    color: var(--muted);
    margin-left: 4px;
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 12px;
  }
  @media (max-width: 600px) {
    .controls { grid-template-columns: 1fr; }
  }
  .control { display: flex; flex-direction: column; gap: 4px; }
  .control label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .strength-row {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .strength-row > label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    min-width: 48px;
  }
  .strength-row input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
  }
  .strength-row #strengthValue {
    min-width: 52px;
    text-align: right;
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .control input[type="number"] {
    background: #0a0d11;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 5px;
    font-family: inherit;
    font-size: 13px;
    width: 100%;
  }
  .fill-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .fill-row label { font-size: 12px; color: var(--muted); }
  .fill-row select {
    padding: 6px 8px;
    border-radius: 5px;
    font-size: 13px;
  }
  .fill-row input[type="color"] {
    width: 36px;
    height: 30px;
    padding: 0;
    border: 1px solid var(--border);
    background: transparent;
    border-radius: 5px;
    cursor: pointer;
  }
  details {
    margin-top: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    background: #0d1116;
  }
  details summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    user-select: none;
  }
  .advanced-body {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 13px;
  }
  .radio-row, .check-row {
    display: flex;
    gap: 14px;
    align-items: center;
    flex-wrap: wrap;
  }
  .radio-row label, .check-row label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .hint {
    color: var(--muted);
    font-size: 12px;
    margin-top: 10px;
    line-height: 1.5;
  }
  .empty-msg {
    color: var(--muted);
    font-size: 13px;
    padding: 40px;
    text-align: center;
  }
  #leftEmpty {
    cursor: pointer;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
  }
  #leftEmpty:hover { color: var(--accent); background: rgba(74,163,255,0.04); }
  .meta {
    color: var(--muted);
    font-size: 12px;
    margin-top: 8px;
  }
  .share-wrap { position: relative; }
  .share-popover {
    display: none;
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    min-width: 220px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.45);
    z-index: 100;
  }
  .share-wrap.open .share-popover { display: block; }
  .share-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 10px;
  }
  .share-buttons button {
    width: 100%;
    font-size: 12px;
    padding: 7px 6px;
  }
  .share-check {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: 0 6px 22px rgba(0,0,0,0.5);
    z-index: 1000;
    max-width: 90vw;
    text-align: center;
  }
  .toast[hidden] { display: none; }
</style>
</head>
<body>
<header>
  <h1>Image Inversion</h1>
  <div class="toolbar">
    <select id="langSelect" title="Language">
      <option value="ko">한국어</option>
      <option value="en">English</option>
    </select>
    <input type="file" id="fileInput" accept="image/*">
    <select id="formatSelect" title="Save format">
      <option value="image/png">PNG</option>
      <option value="image/jpeg">JPEG</option>
      <option value="image/webp">WEBP</option>
    </select>
    <button id="undoBtn" type="button" data-i18n-title="undo" disabled>↶</button>
    <button id="redoBtn" type="button" data-i18n-title="redo" disabled>↷</button>
    <button id="saveBtn" class="primary" data-i18n="save">저장</button>
    <div class="share-wrap" id="shareWrap">
      <button id="shareBtn" data-i18n="share">공유</button>
      <div class="share-popover" id="sharePopover">
        <div class="share-buttons">
          <button type="button" data-share="bluesky">Bluesky</button>
          <button type="button" data-share="x">X</button>
          <button type="button" data-share="threads">Threads</button>
          <button type="button" data-share="instagram">Instagram</button>
          <button type="button" data-share="native" id="shareNativeBtn" data-i18n="shareNative">기기 공유…</button>
          <button type="button" data-share="copy" data-i18n="shareCopyLink">링크 복사</button>
        </div>
        <label class="share-check">
          <input type="checkbox" id="shareIncludeSettings">
          <span data-i18n="shareIncludeSettings">현재 설정 포함</span>
        </label>
      </div>
    </div>
  </div>
</header>
<div class="toast" id="toast" hidden></div>

<main>
  <section class="panel">
    <h2 data-i18n="leftPanel">원본 / 반전원</h2>
    <div class="canvas-wrap" id="leftWrap">
      <div class="empty-msg" id="leftEmpty" data-i18n="uploadPrompt">이미지를 업로드해 주세요</div>
      <canvas id="leftCanvas" style="display:none"></canvas>
    </div>
    <div class="controls">
      <div class="control">
        <label for="cxInput" data-i18n="cx">중심 X (%)</label>
        <input type="number" id="cxInput" min="0" max="100" step="0.1" value="50">
      </div>
      <div class="control">
        <label for="cyInput" data-i18n="cy">중심 Y (%)</label>
        <input type="number" id="cyInput" min="0" max="100" step="0.1" value="50">
      </div>
      <div class="control">
        <label for="rInput" data-i18n="radius">반지름 (px, 미리보기 기준)</label>
        <input type="number" id="rInput" min="1" step="1" value="100">
      </div>
    </div>
    <details id="advanced">
      <summary data-i18n="advanced">고급 옵션</summary>
      <div class="advanced-body">
        <div class="strength-row">
          <label for="strengthInput" data-i18n="strength">강도</label>
          <input type="range" id="strengthInput" min="0" max="100" step="1" value="100">
          <span id="strengthValue">100%</span>
        </div>
        <div class="fill-row">
          <label for="fillMode" data-i18n="fillLabel">정보 없는 영역</label>
          <select id="fillMode">
            <option value="black" data-i18n="fillBlack">검정</option>
            <option value="white" data-i18n="fillWhite">흰색</option>
            <option value="custom" data-i18n="fillCustom">사용자 색</option>
            <option value="transparent" data-i18n="fillTransparent">투명</option>
            <option value="edge" data-i18n="fillEdge">가장자리 확장</option>
          </select>
          <input type="color" id="fillColor" value="#000000">
        </div>
        <div class="radio-row">
          <span data-i18n="sampling">샘플링:</span>
          <label><input type="radio" name="sampling" value="nearest"> <span data-i18n="samplingNearest">Nearest (빠름)</span></label>
          <label><input type="radio" name="sampling" value="bilinear" checked> <span data-i18n="samplingBilinear">Bilinear (부드러움)</span></label>
        </div>
        <div class="check-row">
          <label><input type="checkbox" id="saveFullRes" checked> <span data-i18n="saveFullRes">원본 해상도로 저장</span></label>
        </div>
        <div class="check-row">
          <label><input type="checkbox" id="gridOverlay"> <span data-i18n="gridOverlay">그리드 오버레이</span></label>
          <label style="display:inline-flex; gap:6px; align-items:center; margin-left:8px;">
            <span style="font-size:12px; color:var(--muted)" data-i18n="gridSpacing">간격(px)</span>
            <input type="number" id="gridSpacing" min="2" step="1" style="width:70px; background:#0a0d11; border:1px solid var(--border); color:var(--text); padding:4px 6px; border-radius:5px; font-size:13px;">
          </label>
        </div>
      </div>
    </details>
    <div class="meta" id="meta"></div>
    <div class="hint" data-i18n="leftHint">
      이미지 위를 클릭/탭하면 중심점이 이동합니다. 중심점을 드래그하면 위치를, 점선 경계를 드래그하면 반지름을 조절할 수 있어요.
    </div>
  </section>

  <section class="panel">
    <h2 data-i18n="rightPanel">반전 결과</h2>
    <div class="canvas-wrap" id="rightWrap">
      <div class="empty-msg" id="rightEmpty" data-i18n="rightPlaceholder">결과가 여기에 표시됩니다</div>
      <canvas id="rightCanvas" style="display:none"></canvas>
      <canvas id="rightOverlay" style="display:none"></canvas>
    </div>
    <div class="view-controls">
      <button id="resetViewBtn" type="button" data-i18n="resetView">화면 맞춤</button>
      <span class="zoom-label" id="zoomLabel">100%</span>
    </div>
    <div class="hint" data-i18n-html="rightHint">
      반전(inversion): 중심 O, 반지름 r의 원에 대해 점 Q를 OP·OQ = r²을 만족하는 P로 매핑합니다.<br>
      마우스 휠 또는 두 손가락 핀치로 확대/축소, 드래그로 이동, 더블클릭/더블탭으로 초기화.
    </div>
  </section>
</main>

<script id="worker-src" type="javascript/worker">
  let preview = null;
  let full = null;

  self.onmessage = async (e) => {
    const msg = e.data;
    if (msg.type === 'source') {
      preview = msg.preview;
      full = msg.full || msg.preview;
    } else if (msg.type === 'render') {
      const out = buildImageData(preview, msg.params, preview.w, preview.h);
      self.postMessage(
        { type: 'rendered', token: msg.token, buffer: out.data.buffer, w: preview.w, h: preview.h },
        [out.data.buffer]
      );
    } else if (msg.type === 'renderHiRes') {
      const bw = msg.bitmapW, bh = msg.bitmapH;
      const out = buildImageData(full, msg.params, bw, bh);
      self.postMessage(
        { type: 'renderedHiRes', buffer: out.data.buffer, w: bw, h: bh },
        [out.data.buffer]
      );
    } else if (msg.type === 'export') {
      const useFull = !!msg.useFull;
      const src = useFull ? full : preview;
      const sx = src.w / preview.w;
      const sy = src.h / preview.h;
      const params = {
        ...msg.params,
        cx: msg.params.cx * sx,
        cy: msg.params.cy * sy,
        r: msg.params.r * sx,
      };
      const oc = new OffscreenCanvas(src.w, src.h);
      const fctx = oc.getContext('2d');
      const id = buildImageData(src, params, src.w, src.h);
      fctx.putImageData(id, 0, 0);
      let finalCanvas = oc;
      if (msg.format === 'image/jpeg') {
        const bg = new OffscreenCanvas(src.w, src.h);
        const bgctx = bg.getContext('2d');
        bgctx.fillStyle = '#ffffff';
        bgctx.fillRect(0, 0, src.w, src.h);
        bgctx.drawImage(oc, 0, 0);
        finalCanvas = bg;
      }
      const blob = await finalCanvas.convertToBlob({ type: msg.format, quality: msg.quality });
      self.postMessage({ type: 'exported', blob, ext: msg.ext });
    }
  };

  function buildImageData(src, params, outW, outH) {
    outW = outW || src.w;
    outH = outH || src.h;
    const sw = src.w, sh = src.h;
    const swMax = sw - 1, shMax = sh - 1;
    const swScale = sw / outW;
    const shScale = sh / outH;
    const srcData = src.data;
    const out = new ImageData(outW, outH);
    const dst = out.data;
    const { cx, cy, r, fill, mode, outside } = params;
    const strength = typeof params.strength === 'number' ? params.strength : 1;
    const r2 = r * r;
    const fr = fill[0], fg = fill[1], fb = fill[2], fa = fill[3];
    const edge = outside === 'edge';
    const cxSrc = cx * swScale;
    const cySrc = cy * shScale;
    const cxClamped = cxSrc < 0 ? 0 : (cxSrc > swMax ? swMax : cxSrc | 0);
    const cyClamped = cySrc < 0 ? 0 : (cySrc > shMax ? shMax : cySrc | 0);

    if (mode === 'bilinear') {
      for (let y = 0; y < outH; y++) {
        const dy = y - cy;
        const dy2 = dy * dy;
        const rowOut = y * outW * 4;
        for (let x = 0; x < outW; x++) {
          const dx = x - cx;
          const d2 = dx * dx + dy2;
          const o = rowOut + x * 4;
          if (d2 < 0.5) {
            if (strength <= 0) {
              const sxi = (x * swScale) | 0;
              const syi = (y * shScale) | 0;
              const si = (syi * sw + sxi) * 4;
              dst[o] = srcData[si]; dst[o+1] = srcData[si+1]; dst[o+2] = srcData[si+2]; dst[o+3] = srcData[si+3];
            } else if (edge) {
              const si = (cyClamped * sw + cxClamped) * 4;
              dst[o] = srcData[si]; dst[o+1] = srcData[si+1]; dst[o+2] = srcData[si+2]; dst[o+3] = srcData[si+3];
            } else {
              dst[o] = fr; dst[o+1] = fg; dst[o+2] = fb; dst[o+3] = fa;
            }
            continue;
          }
          const k = r2 / d2;
          const mult = 1 + strength * (k - 1);
          let sx = (cx + dx * mult) * swScale;
          let sy = (cy + dy * mult) * shScale;
          if (sx < 0 || sy < 0 || sx > swMax || sy > shMax) {
            if (edge) {
              if (sx < 0) sx = 0; else if (sx > swMax) sx = swMax;
              if (sy < 0) sy = 0; else if (sy > shMax) sy = shMax;
              const ix = sx | 0, iy = sy | 0;
              const si = (iy * sw + ix) * 4;
              dst[o] = srcData[si]; dst[o+1] = srcData[si+1]; dst[o+2] = srcData[si+2]; dst[o+3] = srcData[si+3];
            } else {
              dst[o] = fr; dst[o+1] = fg; dst[o+2] = fb; dst[o+3] = fa;
            }
            continue;
          }
          const ix = sx | 0;
          const iy = sy | 0;
          const fx = sx - ix;
          const fy = sy - iy;
          const ix1 = ix < swMax ? ix + 1 : ix;
          const iy1 = iy < shMax ? iy + 1 : iy;
          const i00 = (iy  * sw + ix ) * 4;
          const i10 = (iy  * sw + ix1) * 4;
          const i01 = (iy1 * sw + ix ) * 4;
          const i11 = (iy1 * sw + ix1) * 4;
          const w00 = (1 - fx) * (1 - fy);
          const w10 = fx * (1 - fy);
          const w01 = (1 - fx) * fy;
          const w11 = fx * fy;
          dst[o]   = srcData[i00  ]*w00 + srcData[i10  ]*w10 + srcData[i01  ]*w01 + srcData[i11  ]*w11;
          dst[o+1] = srcData[i00+1]*w00 + srcData[i10+1]*w10 + srcData[i01+1]*w01 + srcData[i11+1]*w11;
          dst[o+2] = srcData[i00+2]*w00 + srcData[i10+2]*w10 + srcData[i01+2]*w01 + srcData[i11+2]*w11;
          dst[o+3] = srcData[i00+3]*w00 + srcData[i10+3]*w10 + srcData[i01+3]*w01 + srcData[i11+3]*w11;
        }
      }
    } else {
      for (let y = 0; y < outH; y++) {
        const dy = y - cy;
        const dy2 = dy * dy;
        const rowOut = y * outW * 4;
        for (let x = 0; x < outW; x++) {
          const dx = x - cx;
          const d2 = dx * dx + dy2;
          const o = rowOut + x * 4;
          if (d2 < 0.5) {
            if (strength <= 0) {
              const sxi = (x * swScale) | 0;
              const syi = (y * shScale) | 0;
              const si = (syi * sw + sxi) * 4;
              dst[o] = srcData[si]; dst[o+1] = srcData[si+1]; dst[o+2] = srcData[si+2]; dst[o+3] = srcData[si+3];
            } else if (edge) {
              const si = (cyClamped * sw + cxClamped) * 4;
              dst[o] = srcData[si]; dst[o+1] = srcData[si+1]; dst[o+2] = srcData[si+2]; dst[o+3] = srcData[si+3];
            } else {
              dst[o] = fr; dst[o+1] = fg; dst[o+2] = fb; dst[o+3] = fa;
            }
            continue;
          }
          const k = r2 / d2;
          const mult = 1 + strength * (k - 1);
          const sx = (cx + dx * mult) * swScale;
          const sy = (cy + dy * mult) * shScale;
          let ix = sx | 0;
          let iy = sy | 0;
          if (ix < 0 || iy < 0 || ix >= sw || iy >= sh) {
            if (edge) {
              if (ix < 0) ix = 0; else if (ix > swMax) ix = swMax;
              if (iy < 0) iy = 0; else if (iy > shMax) iy = shMax;
            } else {
              dst[o] = fr; dst[o+1] = fg; dst[o+2] = fb; dst[o+3] = fa;
              continue;
            }
          }
          const si = (iy * sw + ix) * 4;
          dst[o]   = srcData[si];
          dst[o+1] = srcData[si+1];
          dst[o+2] = srcData[si+2];
          dst[o+3] = srcData[si+3];
        }
      }
    }
    return out;
  }
</script>

  let currentLang = 'ko';

  function getHashParams() {
    try { return new URLSearchParams(location.hash.replace(/^#/, '')); }
    catch { return new URLSearchParams(); }
  }

  let suppressHashWrite = true;
  let hashWriteTimer = 0;

  function scheduleHashWrite() {
    if (suppressHashWrite) return;
    if (hashWriteTimer) return;
    hashWriteTimer = setTimeout(() => {
      hashWriteTimer = 0;
      writeHashNow();
    }, 200);
  }

  function writeHashNow() {
    if (suppressHashWrite) return;
    const params = new URLSearchParams();
    params.set('lang', currentLang);
    params.set('fill', fillMode.value);
    params.set('fc', fillColor.value);
    params.set('samp', (document.querySelector('input[name="sampling"]:checked') || {}).value || 'bilinear');
    params.set('grid', gridOverlay.checked ? '1' : '0');
    if (state) {
      params.set('st', Math.round((state.strength != null ? state.strength : 1) * 100));
    }
    if (state && state.previewData) {
      const minD = Math.min(state.previewW, state.previewH);
      params.set('cx', (state.cx / state.previewW * 100).toFixed(2));
      params.set('cy', (state.cy / state.previewH * 100).toFixed(2));
      params.set('rp', (state.r / minD * 100).toFixed(2));

        params.set('vs', view.scale.toFixed(3));
        params.set('vtx', (view.tx / rect.width).toFixed(4));
        params.set('vty', (view.ty / rect.height).toFixed(4));
      }
    }

    if (location.hash !== hash) {
      try { history.replaceState(null, '', hash); } catch {}
    }
    try { localStorage.setItem('hash', hash); } catch {}
  }

  function applyHashToControls(p) {
    const fill = p.get('fill');
    if (fill && fillMode.querySelector(`option[value="${CSS.escape(fill)}"]`)) {
      fillMode.value = fill;
    }
    const fc = p.get('fc');
    if (fc && /^#[0-9a-fA-F]{6}$/.test(fc)) fillColor.value = fc;
    const samp = p.get('samp');
    if (samp === 'nearest' || samp === 'bilinear') {

      });

    if (p.get('grid') === '1') gridOverlay.checked = true;
    else if (p.get('grid') === '0') gridOverlay.checked = false;
    const st = parseFloat(p.get('st'));
    if (isFinite(st)) {
      const s = Math.max(0, Math.min(1, st / 100));
      state.strength = s;
      strengthInput.value = Math.round(s * 100);
      strengthValue.textContent = `${Math.round(s * 100)}%`;
    }
  }

  function initLang() {
    const stored = (() => { try { return localStorage.getItem('lang'); } catch { return null; } })();
    const hashLang = getHashParams().get('lang');
    const initial = (hashLang && T[hashLang]) ? hashLang
      : (stored && T[stored]) ? stored
      : (navigator.language && navigator.language.toLowerCase().startsWith('ko') ? 'ko' : 'en');

  const cxInput = document.getElementById('cxInput');
  const cyInput = document.getElementById('cyInput');
  const rInput = document.getElementById('rInput');
  const fillMode = document.getElementById('fillMode');
  const fillColor = document.getElementById('fillColor');

  const strengthInput = document.getElementById('strengthInput');
  const strengthValue = document.getElementById('strengthValue');

  const MAX_DIM = 900;

  const supportsOffscreen =
    'transferControlToOffscreen' in HTMLCanvasElement.prototype &&
    typeof OffscreenCanvas !== 'undefined';

    img: null,
    srcCanvas: null,
    previewW: 0,
    previewH: 0,
    fullW: 0,
    fullH: 0,
    previewData: null,
    fullData: null,
    cx: 0,
    cy: 0,
    r: 0,
    strength: 1,
    dragMode: null,
  };

  let worker = null;
  let workerReadyForSource = false;
  let workerBusy = false;
  let pendingRender = false;
  let renderToken = 0;
  let exportResolver = null;
  let hiResTimer = 0;
  let hiResInFlight = false;
  const HIRES_MAX = 2400;
  const HIRES_DELAY = 300;

  function fitDimensions(w, h) {
    const m = Math.max(w, h);
    if (m <= MAX_DIM) return { w, h, scale: 1 };
    const s = MAX_DIM / m;
    return { w: Math.round(w * s), h: Math.round(h * s), scale: s };
  }

  function getSamplingMode() {
    const r = document.querySelector('input[name="sampling"]:checked');
    return r ? r.value : 'nearest';
  }

  function initWorker() {
    if (!supportsOffscreen) return;
    const code = document.getElementById('worker-src').textContent;
    const blob = new Blob([code], { type: 'application/javascript' });
    worker = new Worker(URL.createObjectURL(blob));
    worker.onmessage = (e) => {
      const msg = e.data;
      if (msg.type === 'rendered') {
        paintWorkerResult(msg);
        workerBusy = false;
        if (pendingRender) {
          pendingRender = false;
          sendRender();
        }
      } else if (msg.type === 'renderedHiRes') {
        paintWorkerResult(msg);
        hiResInFlight = false;
      } else if (msg.type === 'exported') {
        if (exportResolver) {
          exportResolver({ blob: msg.blob, ext: msg.ext });
          exportResolver = null;
        }
      }
    };
    workerReadyForSource = true;
  }

  function paintWorkerResult(msg) {
    if (!msg || !msg.buffer) return;
    const w = msg.w, h = msg.h;
    if (rightCanvas.width !== w) rightCanvas.width = w;
    if (rightCanvas.height !== h) rightCanvas.height = h;
    const ctx = rightCanvas.getContext('2d');
    const id = new ImageData(new Uint8ClampedArray(msg.buffer), w, h);
    ctx.putImageData(id, 0, 0);
  }

  function parseFill() {
    const mode = fillMode.value;
    if (mode === 'transparent') return [0, 0, 0, 0];
    if (mode === 'black') return [0, 0, 0, 255];
    if (mode === 'white') return [255, 255, 255, 255];
    const hex = fillColor.value;
    return [
      parseInt(hex.slice(1, 3), 16),
      parseInt(hex.slice(3, 5), 16),
      parseInt(hex.slice(5, 7), 16),
      255,
    ];
  }

  function currentParams() {
    return {
      cx: state.cx,
      cy: state.cy,
      r: state.r,
      strength: state.strength,
      fill: parseFill(),
      mode: getSamplingMode(),
      outside: fillMode.value === 'edge' ? 'edge' : 'fill',

  }

  function sendRender() {
    if (!worker || !state.previewData) return;
    if (workerBusy) {
      pendingRender = true;
      return;
    }
    workerBusy = true;
    renderToken++;
    worker.postMessage({ type: 'render', token: renderToken, params: currentParams() });
  }

  function scheduleHiResRender() {
    if (hiResTimer) clearTimeout(hiResTimer);
    hiResTimer = 0;
    if (!worker || !state.previewData) return;
    if (!view || view.scale <= 1.05) return;
    hiResTimer = setTimeout(triggerHiResRender, HIRES_DELAY);
  }

  function triggerHiResRender() {
    hiResTimer = 0;
    if (!worker || !state.previewData) return;
    if (!view || view.scale <= 1.05) return;
    if (workerBusy || hiResInFlight) {
      hiResTimer = setTimeout(triggerHiResRender, 100);
      return;
    }
    const wrapRect = rightWrap.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    let hiW = Math.round(wrapRect.width * dpr * view.scale);
    let hiH = Math.round(wrapRect.height * dpr * view.scale);
    const MAX_PIXELS = 12_000_000;
    if (hiW * hiH > MAX_PIXELS) {
      const s = Math.sqrt(MAX_PIXELS / (hiW * hiH));
      hiW = Math.round(hiW * s);
      hiH = Math.round(hiH * s);
    }
    if (hiW <= state.previewW * 1.1 || hiH <= state.previewH * 1.1) return;
    const sxScale = hiW / state.previewW;
    const syScale = hiH / state.previewH;
    const p = currentParams();
    const params = { ...p, cx: p.cx * sxScale, cy: p.cy * syScale, r: p.r * sxScale };
    hiResInFlight = true;
    worker.postMessage({ type: 'renderHiRes', params, bitmapW: hiW, bitmapH: hiH });
  }

  function loadImage(file, opts) {
    opts = opts || {};
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      if (!opts.skipPersist) {
        const name = (file && file.name) || 'image';
        const type = (file && file.type) || 'image/png';
        idbPut('lastImage', { blob: file, name, type }).catch(() => {});
      }
      const fullW = img.naturalWidth;
      const fullH = img.naturalHeight;
      const fit = fitDimensions(fullW, fullH);
      const previewW = fit.w;
      const previewH = fit.h;

      const full = document.createElement('canvas');
      full.width = fullW;
      full.height = fullH;
      const fctx = full.getContext('2d');
      fctx.drawImage(img, 0, 0);
      const fullData = fctx.getImageData(0, 0, fullW, fullH);

      const prev = document.createElement('canvas');
      prev.width = previewW;
      prev.height = previewH;
      const pctx = prev.getContext('2d');
      pctx.imageSmoothingQuality = 'high';
      pctx.drawImage(img, 0, 0, previewW, previewH);
      const previewData = pctx.getImageData(0, 0, previewW, previewH);

      state.img = img;
      state.srcCanvas = prev;
      state.previewW = previewW;
      state.previewH = previewH;
      state.fullW = fullW;
      state.fullH = fullH;
      state.previewData = previewData;
      state.fullData = fullData;
      const minD = Math.min(previewW, previewH);
      state.cx = previewW / 2;
      state.cy = previewH / 2;
      state.r = minD * 0.3;

      const hashP = getHashParams();
      const cxp = parseFloat(hashP.get('cx'));
      const cyp = parseFloat(hashP.get('cy'));
      const rp = parseFloat(hashP.get('rp'));
      if (isFinite(cxp)) state.cx = Math.max(0, Math.min(previewW, cxp / 100 * previewW));
      if (isFinite(cyp)) state.cy = Math.max(0, Math.min(previewH, cyp / 100 * previewH));
      if (isFinite(rp) && rp > 0) state.r = Math.max(1, rp / 100 * minD);

      leftCanvas.width = previewW;
      leftCanvas.height = previewH;
      rightOverlay.width = previewW;
      rightOverlay.height = previewH;
      const gsp = parseFloat(hashP.get('gs'));
      if (isFinite(gsp) && gsp > 0) {
        gridSpacing.value = String(Math.max(2, Math.round(gsp / 100 * minD)));
      } else if (!gridSpacing.value) {
        gridSpacing.value = Math.max(8, Math.round(minD / 12));
      }

      leftCanvas.style.display = 'block';
      rightCanvas.style.display = 'block';
      leftEmpty.style.display = 'none';
      rightEmpty.style.display = 'none';

      rightWrap.style.aspectRatio = `${previewW} / ${previewH}`;
      rightWrap.style.minHeight = '0';

      const prevSuppress = suppressHashWrite;
      suppressHashWrite = true;
      resetView();
      const vs = parseFloat(hashP.get('vs'));
      const vtx = parseFloat(hashP.get('vtx'));
      const vty = parseFloat(hashP.get('vty'));
      if (isFinite(vs) && vs > 0) {
        view.scale = Math.max(0.2, Math.min(40, vs));
        const rect = rightWrap.getBoundingClientRect();
        if (isFinite(vtx)) view.tx = vtx * rect.width;
        if (isFinite(vty)) view.ty = vty * rect.height;
        applyView();
      }
      suppressHashWrite = prevSuppress;

      updateInputs();
      updateMeta();
      drawOverlay();
      drawGridOverlay();

      if (worker && workerReadyForSource) {
        const previewBuf = previewData.data;
        const fullBuf = fullData.data;
        const samePixels = previewW === fullW && previewH === fullH;
        const message = {
          type: 'source',
          preview: { w: previewW, h: previewH, data: previewBuf },
        };
        const transfer = [previewBuf.buffer];
        if (!samePixels) {
          message.full = { w: fullW, h: fullH, data: fullBuf };
          transfer.push(fullBuf.buffer);
        }
        worker.postMessage(message, transfer);
        workerBusy = false;
        sendRender();
      } else {
        renderSyncFallback();
      }
      resetHistory();
    };
    img.src = url;
  }

  function renderSyncFallback() {
    if (!state.previewData) return;
    const w = state.previewW, h = state.previewH;
    if (rightCanvas.width !== w) rightCanvas.width = w;
    if (rightCanvas.height !== h) rightCanvas.height = h;
    const rctx = rightCanvas.getContext('2d');
    const src = state.previewData.data;
    const out = rctx.createImageData(w, h);
    const dst = out.data;
    const params = currentParams();
    const { cx, cy, r, fill, mode, outside } = params;
    const strength = typeof params.strength === 'number' ? params.strength : 1;
    const r2 = r * r;
    const [fr, fg, fb, fa] = fill;
    const edge = outside === 'edge';
    const wMax = w - 1, hMax = h - 1;
    const cxC = cx < 0 ? 0 : (cx > wMax ? wMax : cx | 0);
    const cyC = cy < 0 ? 0 : (cy > hMax ? hMax : cy | 0);
    if (mode === 'bilinear') {
      for (let y = 0; y < h; y++) {
        const dy = y - cy, dy2 = dy * dy, rowOut = y * w * 4;
        for (let x = 0; x < w; x++) {
          const dx = x - cx, d2 = dx*dx + dy2, o = rowOut + x*4;
          if (d2 < 0.5) {
            if (strength <= 0) {
              const si = (y*w + x)*4;
              dst[o]=src[si]; dst[o+1]=src[si+1]; dst[o+2]=src[si+2]; dst[o+3]=src[si+3];
            } else if (edge) {
              const si = (cyC*w + cxC)*4;
              dst[o]=src[si]; dst[o+1]=src[si+1]; dst[o+2]=src[si+2]; dst[o+3]=src[si+3];
            } else { dst[o]=fr; dst[o+1]=fg; dst[o+2]=fb; dst[o+3]=fa; }
            continue;
          }
          const k = r2/d2;
          const mult = 1 + strength * (k - 1);
          let sx = cx + dx*mult, sy = cy + dy*mult;
          if (sx < 0 || sy < 0 || sx > wMax || sy > hMax) {
            if (edge) {
              if (sx < 0) sx = 0; else if (sx > wMax) sx = wMax;
              if (sy < 0) sy = 0; else if (sy > hMax) sy = hMax;
              const ix = sx|0, iy = sy|0;
              const si = (iy*w + ix)*4;
              dst[o]=src[si]; dst[o+1]=src[si+1]; dst[o+2]=src[si+2]; dst[o+3]=src[si+3];
            } else { dst[o]=fr; dst[o+1]=fg; dst[o+2]=fb; dst[o+3]=fa; }
            continue;
          }
          const ix=sx|0, iy=sy|0, fx=sx-ix, fy=sy-iy;
          const ix1 = ix < wMax ? ix+1 : ix;
          const iy1 = iy < hMax ? iy+1 : iy;
          const i00=(iy*w+ix)*4, i10=(iy*w+ix1)*4, i01=(iy1*w+ix)*4, i11=(iy1*w+ix1)*4;
          const w00=(1-fx)*(1-fy), w10=fx*(1-fy), w01=(1-fx)*fy, w11=fx*fy;
          dst[o]   = src[i00]*w00 + src[i10]*w10 + src[i01]*w01 + src[i11]*w11;
          dst[o+1] = src[i00+1]*w00 + src[i10+1]*w10 + src[i01+1]*w01 + src[i11+1]*w11;
          dst[o+2] = src[i00+2]*w00 + src[i10+2]*w10 + src[i01+2]*w01 + src[i11+2]*w11;
          dst[o+3] = src[i00+3]*w00 + src[i10+3]*w10 + src[i01+3]*w01 + src[i11+3]*w11;
        }
      }
    } else {
      for (let y = 0; y < h; y++) {
        const dy = y - cy, dy2 = dy*dy, rowOut = y*w*4;
        for (let x = 0; x < w; x++) {
          const dx = x - cx, d2 = dx*dx + dy2, o = rowOut + x*4;
          if (d2 < 0.5) {
            if (strength <= 0) {
              const si = (y*w + x)*4;
              dst[o]=src[si]; dst[o+1]=src[si+1]; dst[o+2]=src[si+2]; dst[o+3]=src[si+3];
            } else if (edge) {
              const si = (cyC*w + cxC)*4;
              dst[o]=src[si]; dst[o+1]=src[si+1]; dst[o+2]=src[si+2]; dst[o+3]=src[si+3];
            } else { dst[o]=fr; dst[o+1]=fg; dst[o+2]=fb; dst[o+3]=fa; }
            continue;
          }
          const k = r2/d2;
          const mult = 1 + strength * (k - 1);
          const sx = cx + dx*mult, sy = cy + dy*mult;
          let ix = sx|0, iy = sy|0;
          if (ix < 0 || iy < 0 || ix >= w || iy >= h) {
            if (edge) {
              if (ix < 0) ix = 0; else if (ix > wMax) ix = wMax;
              if (iy < 0) iy = 0; else if (iy > hMax) iy = hMax;
            } else {
              dst[o]=fr; dst[o+1]=fg; dst[o+2]=fb; dst[o+3]=fa; continue;
            }
          }
          const si = (iy*w + ix)*4;
          dst[o]=src[si]; dst[o+1]=src[si+1]; dst[o+2]=src[si+2]; dst[o+3]=src[si+3];
        }
      }
    }
    rctx.putImageData(out, 0, 0);
  }

  function requestRender() {
    if (!state.previewData) return;
    drawOverlay();
    drawGridOverlay();
    if (worker) sendRender();
    else renderSyncFallback();
    scheduleHashWrite();
    scheduleHiResRender();
  }

  function drawGridOverlay() {
    if (!state.previewData) return;
    if (!gridOverlay.checked) {
      rightOverlay.style.display = 'none';
      return;
    }
    rightOverlay.style.display = 'block';
    const w = state.previewW;
    const h = state.previewH;
    const cx = state.cx;
    const cy = state.cy;
    const r = state.r;
    const r2 = r * r;
    let s = parseFloat(gridSpacing.value);
    if (!isFinite(s) || s <= 1) s = Math.max(8, Math.min(w, h) / 12);

    octx.clearRect(0, 0, w, h);

    octx.strokeStyle = 'rgba(255,255,255,0.7)';
    octx.lineWidth = 1;
    octx.beginPath();
    for (let x = 0; x <= w + 0.5; x += s) {
      const d = x - cx;
      if (Math.abs(d) < 0.5) {
        octx.moveTo(x, 0);
        octx.lineTo(x, h);
      } else {
        const rc = r2 / (2 * Math.abs(d));
        const ccx = cx + r2 / (2 * d);
        octx.moveTo(ccx + rc, cy);
        octx.arc(ccx, cy, rc, 0, Math.PI * 2);
      }
    }
    for (let y = 0; y <= h + 0.5; y += s) {
      const d = y - cy;
      if (Math.abs(d) < 0.5) {
        octx.moveTo(0, y);
        octx.lineTo(w, y);
      } else {
        const rc = r2 / (2 * Math.abs(d));
        const ccy = cy + r2 / (2 * d);
        octx.moveTo(cx + rc, ccy);
        octx.arc(cx, ccy, rc, 0, Math.PI * 2);
      }
    }
    octx.stroke();
  }

  function updateInputs() {
    cxInput.value = (state.cx / state.previewW * 100).toFixed(2);
    cyInput.value = (state.cy / state.previewH * 100).toFixed(2);
    rInput.value = Math.round(state.r);
    rInput.max = Math.max(state.previewW, state.previewH) * 4;
    strengthInput.value = Math.round(state.strength * 100);
    strengthValue.textContent = `${Math.round(state.strength * 100)}%`;
  }

  function updateMeta() {
    const scale = state.fullW / state.previewW;
    const fullR = Math.round(state.r * scale);
    metaEl.textContent = T[currentLang].meta(
      state.previewW, state.previewH,
      state.fullW, state.fullH, fullR
    );
  }

  function drawOverlay() {
    if (!state.srcCanvas) return;
    lctx.drawImage(state.srcCanvas, 0, 0);

    if (gridOverlay && gridOverlay.checked) {
      const w = state.previewW, h = state.previewH;
      let s = parseFloat(gridSpacing.value);
      if (!isFinite(s) || s <= 1) s = Math.max(8, Math.min(w, h) / 12);
      lctx.save();
      lctx.strokeStyle = 'rgba(255,255,255,0.7)';
      lctx.lineWidth = 1;
      lctx.beginPath();
      for (let x = 0; x <= w + 0.5; x += s) {
        lctx.moveTo(x, 0);
        lctx.lineTo(x, h);
      }
      for (let y = 0; y <= h + 0.5; y += s) {
        lctx.moveTo(0, y);
        lctx.lineTo(w, y);
      }
      lctx.stroke();
      lctx.restore();
    }

    lctx.save();
    lctx.setLineDash([6, 6]);
    lctx.lineWidth = 2;
    lctx.strokeStyle = 'rgba(80,200,255,0.95)';
    lctx.beginPath();
    lctx.arc(state.cx, state.cy, state.r, 0, Math.PI * 2);
    lctx.stroke();
    lctx.strokeStyle = 'rgba(0,0,0,0.6)';
    lctx.setLineDash([6, 6]);
    lctx.lineDashOffset = 6;
    lctx.beginPath();
    lctx.arc(state.cx, state.cy, state.r, 0, Math.PI * 2);
    lctx.stroke();
    lctx.restore();

    lctx.save();
    lctx.fillStyle = 'rgba(74,163,255,0.95)';
    lctx.strokeStyle = '#fff';
    lctx.lineWidth = 2;
    lctx.beginPath();
    lctx.arc(state.cx, state.cy, 6, 0, Math.PI * 2);
    lctx.fill();
    lctx.stroke();
    lctx.restore();
  }

  function canvasCoords(evt) {
    const rect = leftCanvas.getBoundingClientRect();
    const sx = leftCanvas.width / rect.width;
    const sy = leftCanvas.height / rect.height;
    return {
      x: (evt.clientX - rect.left) * sx,
      y: (evt.clientY - rect.top) * sy,
    };
  }

  function hitTest(x, y) {
    const dx = x - state.cx;
    const dy = y - state.cy;
    const d = Math.hypot(dx, dy);
    const edgeTol = Math.max(8, state.r * 0.05);
    if (Math.abs(d - state.r) <= edgeTol) return 'edge';
    return d < state.r ? 'inside' : 'outside';
  }

  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  leftCanvas.addEventListener('pointerdown', (e) => {
    if (!state.previewData) return;
    leftCanvas.setPointerCapture(e.pointerId);
    const { x, y } = canvasCoords(e);
    const hit = hitTest(x, y);
    if (hit === 'edge') {
      state.dragMode = 'resize';
    } else if (hit === 'inside') {
      state.dragOffsetX = state.cx - x;
      state.dragOffsetY = state.cy - y;
      state.dragMode = 'pan';
    } else {
      state.cx = clamp(x, 0, state.previewW);
      state.cy = clamp(y, 0, state.previewH);
      state.dragOffsetX = 0;
      state.dragOffsetY = 0;
      state.dragMode = 'pan';
      updateInputs();
      updateMeta();
      requestRender();
    }
  });

  leftCanvas.addEventListener('pointermove', (e) => {
    if (!state.previewData) return;
    const { x, y } = canvasCoords(e);
    if (!state.dragMode) {
      const hit = hitTest(x, y);
      leftCanvas.style.cursor =
        hit === 'edge' ? 'nwse-resize' :
        hit === 'inside' ? 'grab' : 'crosshair';
      return;
    }
    if (state.dragMode === 'pan') {
      state.cx = clamp(x + (state.dragOffsetX || 0), 0, state.previewW);
      state.cy = clamp(y + (state.dragOffsetY || 0), 0, state.previewH);
    } else if (state.dragMode === 'resize') {
      state.r = Math.max(1, Math.hypot(x - state.cx, y - state.cy));
    }
    updateInputs();
    updateMeta();
    requestRender();
  });

  const endDrag = (e) => {
    if (state.dragMode) {
      state.dragMode = null;
      try { leftCanvas.releasePointerCapture(e.pointerId); } catch {}
      pushSnapshot();
    }
  };
  leftCanvas.addEventListener('pointerup', endDrag);
  leftCanvas.addEventListener('pointercancel', endDrag);

  cxInput.addEventListener('input', () => {
    if (!state.previewData) return;
    const v = parseFloat(cxInput.value);
    if (!isNaN(v)) {
      state.cx = clamp(v / 100 * state.previewW, 0, state.previewW);
      updateMeta();
      requestRender();
    }
  });
  cyInput.addEventListener('input', () => {
    if (!state.previewData) return;
    const v = parseFloat(cyInput.value);
    if (!isNaN(v)) {
      state.cy = clamp(v / 100 * state.previewH, 0, state.previewH);
      updateMeta();
      requestRender();
    }
  });
  rInput.addEventListener('input', () => {
    if (!state.previewData) return;
    const v = parseFloat(rInput.value);
    if (!isNaN(v) && v > 0) {
      state.r = v;
      updateMeta();
      requestRender();
    }
  });
  strengthInput.addEventListener('input', () => {
    const v = parseFloat(strengthInput.value);
    if (!isNaN(v)) {
      state.strength = Math.max(0, Math.min(1, v / 100));
      strengthValue.textContent = `${Math.round(state.strength * 100)}%`;
      if (state.previewData) requestRender();
      else scheduleHashWrite();
    }
  });

  cxInput.addEventListener('change', pushSnapshot);
  cyInput.addEventListener('change', pushSnapshot);
  rInput.addEventListener('change', pushSnapshot);
  strengthInput.addEventListener('change', pushSnapshot);

  function syncFillColorEnabled() {
    const on = fillMode.value === 'custom';
    fillColor.disabled = !on;
    fillColor.style.opacity = on ? '1' : '0.4';
  }
  syncFillColorEnabled();
  fillMode.addEventListener('change', () => {
    syncFillColorEnabled();
    requestRender();
    pushSnapshot();
  });
  fillColor.addEventListener('input', () => {
    if (fillMode.value === 'custom') requestRender();
    else scheduleHashWrite();
  });
  fillColor.addEventListener('change', pushSnapshot);
  document.querySelectorAll('input[name="sampling"]').forEach(el => {
    el.addEventListener('change', () => {
      requestRender();
      pushSnapshot();
    });
  });

  gridOverlay.addEventListener('change', () => {
    drawOverlay();
    drawGridOverlay();
    scheduleHashWrite();
    pushSnapshot();
  });
  gridSpacing.addEventListener('input', () => {
    if (gridOverlay.checked) {
      drawOverlay();
      drawGridOverlay();
    }
    scheduleHashWrite();
  });
  gridSpacing.addEventListener('change', pushSnapshot);

  fileInput.addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) loadImage(f);
  });

  leftEmpty.addEventListener('click', () => fileInput.click());

  async function exportImage(opts) {
    opts = opts || {};
    const type = opts.format || formatSelect.value;
    const ext = type === 'image/jpeg' ? 'jpg' : type === 'image/webp' ? 'webp' : 'png';
    const useFull = opts.useFull !== undefined ? opts.useFull : saveFullRes.checked;
    if (worker) {
      return new Promise((resolve) => {
        exportResolver = resolve;
        worker.postMessage({
          type: 'export',
          params: currentParams(),
          useFull,
          format: type,
          quality: 0.95,
          ext,
        });
      });
    }
    return new Promise((resolve) => {
      const w = useFull ? state.fullW : state.previewW;
      const h = useFull ? state.fullH : state.previewH;
      const src = useFull ? state.fullData : state.previewData;
      const sx = w / state.previewW;
      const oc = document.createElement('canvas');
      oc.width = w; oc.height = h;
      const ctx = oc.getContext('2d');
      const out = ctx.createImageData(w, h);
      const dst = out.data;
      const srcArr = src.data;
      const cx = state.cx * sx, cy = state.cy * (h / state.previewH), r = state.r * sx;
      const r2 = r * r;
      const [fr, fg, fb, fa] = parseFill();
      const mode = getSamplingMode();
      const edge = fillMode.value === 'edge';
      const strength = typeof state.strength === 'number' ? state.strength : 1;
      const wMax = w - 1, hMax = h - 1;
      const cxC = cx < 0 ? 0 : (cx > wMax ? wMax : cx | 0);
      const cyC = cy < 0 ? 0 : (cy > hMax ? hMax : cy | 0);
      for (let y = 0; y < h; y++) {
        const dy = y - cy, dy2 = dy*dy, rowOut = y*w*4;
        for (let x = 0; x < w; x++) {
          const dx = x - cx, d2 = dx*dx + dy2, o = rowOut + x*4;
          if (d2 < 0.5) {
            if (strength <= 0) {
              const si = (y*w + x)*4;
              dst[o]=srcArr[si]; dst[o+1]=srcArr[si+1]; dst[o+2]=srcArr[si+2]; dst[o+3]=srcArr[si+3];
            } else if (edge) {
              const si = (cyC*w + cxC)*4;
              dst[o]=srcArr[si]; dst[o+1]=srcArr[si+1]; dst[o+2]=srcArr[si+2]; dst[o+3]=srcArr[si+3];
            } else { dst[o]=fr; dst[o+1]=fg; dst[o+2]=fb; dst[o+3]=fa; }
            continue;
          }
          const k = r2/d2;
          const mult = 1 + strength * (k - 1);
          let sxp = cx + dx*mult, syp = cy + dy*mult;
          const inBounds = sxp >= 0 && syp >= 0 && sxp <= wMax && syp <= hMax;
          if (mode === 'bilinear' && inBounds) {
            const ix=sxp|0, iy=syp|0, fxp=sxp-ix, fyp=syp-iy;
            const ix1 = ix < wMax ? ix+1 : ix;
            const iy1 = iy < hMax ? iy+1 : iy;
            const i00=(iy*w+ix)*4, i10=(iy*w+ix1)*4, i01=(iy1*w+ix)*4, i11=(iy1*w+ix1)*4;
            const w00=(1-fxp)*(1-fyp), w10=fxp*(1-fyp), w01=(1-fxp)*fyp, w11=fxp*fyp;
            dst[o]   = srcArr[i00]*w00 + srcArr[i10]*w10 + srcArr[i01]*w01 + srcArr[i11]*w11;
            dst[o+1] = srcArr[i00+1]*w00 + srcArr[i10+1]*w10 + srcArr[i01+1]*w01 + srcArr[i11+1]*w11;
            dst[o+2] = srcArr[i00+2]*w00 + srcArr[i10+2]*w10 + srcArr[i01+2]*w01 + srcArr[i11+2]*w11;
            dst[o+3] = srcArr[i00+3]*w00 + srcArr[i10+3]*w10 + srcArr[i01+3]*w01 + srcArr[i11+3]*w11;
          } else {
            let ix = sxp|0, iy = syp|0;
            if (ix < 0 || iy < 0 || ix >= w || iy >= h) {
              if (edge) {
                if (ix < 0) ix = 0; else if (ix > wMax) ix = wMax;
                if (iy < 0) iy = 0; else if (iy > hMax) iy = hMax;
              } else {
                dst[o]=fr; dst[o+1]=fg; dst[o+2]=fb; dst[o+3]=fa; continue;
              }
            }
            const si = (iy*w+ix)*4;
            dst[o]=srcArr[si]; dst[o+1]=srcArr[si+1]; dst[o+2]=srcArr[si+2]; dst[o+3]=srcArr[si+3];
          }
        }
      }
      ctx.putImageData(out, 0, 0);
      let target = oc;
      if (type === 'image/jpeg') {
        const bg = document.createElement('canvas');
        bg.width = w; bg.height = h;
        const bctx = bg.getContext('2d');
        bctx.fillStyle = '#fff'; bctx.fillRect(0, 0, w, h);
        bctx.drawImage(oc, 0, 0);
        target = bg;
      }
      target.toBlob((blob) => resolve({ blob, ext }), type, 0.95);
    });
  }

  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');
  let historyStack = [];
  let historyIndex = -1;
  const HISTORY_MAX = 50;

  function getSnapshot() {
    return {
      cx: state.cx,
      cy: state.cy,
      r: state.r,
      strength: state.strength,
      fillMode: fillMode.value,
      fillColor: fillColor.value,
      sampling: getSamplingMode(),
      gridOverlay: gridOverlay.checked,
      gridSpacing: gridSpacing.value,
    };
  }

  function snapshotsEqual(a, b) {
    if (!a || !b) return false;
    return a.cx === b.cx && a.cy === b.cy && a.r === b.r &&
      a.strength === b.strength && a.fillMode === b.fillMode &&
      a.fillColor === b.fillColor && a.sampling === b.sampling &&
      a.gridOverlay === b.gridOverlay && a.gridSpacing === b.gridSpacing;
  }

  function applySnapshot(snap) {
    state.cx = snap.cx;
    state.cy = snap.cy;
    state.r = snap.r;
    state.strength = snap.strength;
    fillMode.value = snap.fillMode;
    fillColor.value = snap.fillColor;
    document.querySelectorAll('input[name="sampling"]').forEach((r) => {
      r.checked = r.value === snap.sampling;
    });
    gridOverlay.checked = snap.gridOverlay;
    gridSpacing.value = snap.gridSpacing;
    syncFillColorEnabled();
    updateInputs();
    updateMeta();
    drawOverlay();
    drawGridOverlay();
    if (worker) sendRender();
    else renderSyncFallback();
    scheduleHashWrite();
    scheduleHiResRender();
  }

  function pushSnapshot() {
    if (!state.previewData) return;
    const snap = getSnapshot();
    if (snapshotsEqual(historyStack[historyIndex], snap)) return;
    historyStack = historyStack.slice(0, historyIndex + 1);
    historyStack.push(snap);
    if (historyStack.length > HISTORY_MAX) {
      historyStack = historyStack.slice(-HISTORY_MAX);
    }
    historyIndex = historyStack.length - 1;
    updateUndoButtons();
  }

  function undo() {
    if (historyIndex <= 0) return;
    historyIndex--;
    applySnapshot(historyStack[historyIndex]);
    updateUndoButtons();
  }

  function redo() {
    if (historyIndex >= historyStack.length - 1) return;
    historyIndex++;
    applySnapshot(historyStack[historyIndex]);
    updateUndoButtons();
  }

  function updateUndoButtons() {
    undoBtn.disabled = historyIndex <= 0;
    redoBtn.disabled = historyIndex >= historyStack.length - 1;
  }

  function resetHistory() {
    historyStack = [];
    historyIndex = -1;
    pushSnapshot();
  }

  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);

  document.addEventListener('keydown', (e) => {
    const t = e.target;
    if (t && t.matches && t.matches('input, textarea, select')) return;
    const mod = e.ctrlKey || e.metaKey;
    if (!mod) return;
    const key = e.key.toLowerCase();
    if (key === 'z' && !e.shiftKey) {
      e.preventDefault();
      undo();
    } else if ((key === 'z' && e.shiftKey) || key === 'y') {
      e.preventDefault();
      redo();
    }
  });

  saveBtn.addEventListener('click', async () => {
    if (!state.previewData) return;
    saveBtn.disabled = true;
    const orig = saveBtn.textContent;
    saveBtn.textContent = T[currentLang].saving;
    try {
      const { blob, ext } = await exportImage();
      if (!blob) return;
      const filename = `inversion.${ext}`;
      const file = new File([blob], filename, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'Inverted Image' });
          return;
        } catch (err) {
          if (err && (err.name === 'AbortError' || err.name === 'NotAllowedError')) return;
        }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = T[currentLang].save;
    }
  });

  const view = { scale: 1, tx: 0, ty: 0 };
  const MIN_SCALE = 0.2;
  const MAX_SCALE = 40;
  const rightPointers = new Map();
  let lastPinch = null;

  function applyView() {
    const t = `translate(${view.tx}px, ${view.ty}px) scale(${view.scale})`;
    rightCanvas.style.transform = t;
    rightOverlay.style.transform = t;
    if (zoomLabel) zoomLabel.textContent = `${Math.round(view.scale * 100)}%`;
    scheduleHashWrite();
    scheduleHiResRender();
  }

  function zoomAt(x, y, factor) {
    const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, view.scale * factor));
    const k = newScale / view.scale;
    view.tx = x - (x - view.tx) * k;
    view.ty = y - (y - view.ty) * k;
    view.scale = newScale;
    applyView();
  }

  function resetView() {
    view.scale = 1;
    view.tx = 0;
    view.ty = 0;
    applyView();
  }

  resetViewBtn.addEventListener('click', resetView);

  rightCanvas.addEventListener('wheel', (e) => {
    if (!state.previewData) return;
    e.preventDefault();
    const rect = rightWrap.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const factor = Math.exp(-e.deltaY * 0.0015);
    zoomAt(x, y, factor);
  }, { passive: false });

  rightCanvas.addEventListener('dblclick', (e) => {
    e.preventDefault();
    resetView();
  });

  rightCanvas.addEventListener('pointerdown', (e) => {
    if (!state.previewData) return;
    rightCanvas.setPointerCapture(e.pointerId);
    rightPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (rightPointers.size === 2) {
      const pts = [...rightPointers.values()];
      lastPinch = {
        midX: (pts[0].x + pts[1].x) / 2,
        midY: (pts[0].y + pts[1].y) / 2,
        dist: Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y),
      };
    }
    rightCanvas.classList.add('grabbing');
  });

  rightCanvas.addEventListener('pointermove', (e) => {
    if (!rightPointers.has(e.pointerId)) return;
    const prev = rightPointers.get(e.pointerId);
    rightPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (rightPointers.size === 1) {
      view.tx += e.clientX - prev.x;
      view.ty += e.clientY - prev.y;
      applyView();
    } else if (rightPointers.size === 2 && lastPinch) {
      const pts = [...rightPointers.values()];
      const midX = (pts[0].x + pts[1].x) / 2;
      const midY = (pts[0].y + pts[1].y) / 2;
      const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
      const rect = rightWrap.getBoundingClientRect();
      view.tx += midX - lastPinch.midX;
      view.ty += midY - lastPinch.midY;
      zoomAt(midX - rect.left, midY - rect.top, dist / lastPinch.dist);
      lastPinch = { midX, midY, dist };
    }
  });

  function endRightPointer(e) {
    if (rightPointers.has(e.pointerId)) {
      rightPointers.delete(e.pointerId);
      try { rightCanvas.releasePointerCapture(e.pointerId); } catch {}
    }
    if (rightPointers.size < 2) lastPinch = null;
    if (rightPointers.size === 0) rightCanvas.classList.remove('grabbing');
  }
  rightCanvas.addEventListener('pointerup', endRightPointer);
  rightCanvas.addEventListener('pointercancel', endRightPointer);

  const VERSION = '0.1';
  const shareWrap = document.getElementById('shareWrap');
  const shareBtn = document.getElementById('shareBtn');
  const shareNativeBtn = document.getElementById('shareNativeBtn');
  const shareIncludeSettings = document.getElementById('shareIncludeSettings');
  const toastEl = document.getElementById('toast');

  let toastTimer = 0;
  function showToast(msg) {
    if (!msg) return;
    toastEl.textContent = msg;
    toastEl.hidden = false;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.hidden = true; }, 3200);
  }

  function getShareLink() {
    return shareIncludeSettings.checked
      ? location.href
      : (location.origin + location.pathname);
  }

  async function copyImageToClipboardSafe(blob) {
    if (!blob || !navigator.clipboard || typeof ClipboardItem === 'undefined') return false;
    try {
      await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
      return true;
    } catch { return false; }
  }

  function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function getShareBlob() {
    try {
      const r = await exportImage({ format: 'image/png', useFull: true });
      return r && r.blob ? r.blob : null;
    } catch { return null; }
  }

  shareBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    shareWrap.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!shareWrap.contains(e.target)) shareWrap.classList.remove('open');
  });

  function canNativeShareFiles() {
    try {
      const probe = new File([new Blob()], 'p.png', { type: 'image/png' });
      return !!(navigator.canShare && navigator.canShare({ files: [probe] }));
    } catch { return false; }
  }
  if (!canNativeShareFiles()) {
    shareNativeBtn.style.display = 'none';
  }

  function composeUrlFor(platform, dict) {
    const text = dict.shareText(VERSION, getShareLink());
    if (platform === 'bluesky') {
      return `https://bsky.app/intent/compose?text=${encodeURIComponent(text)}`;
    }
    if (platform === 'x') {
      const link = getShareLink();
      const t = dict.shareTextShort(VERSION);
      return `https://twitter.com/intent/tweet?text=${encodeURIComponent(t)}&url=${encodeURIComponent(link)}`;
    }
    if (platform === 'threads') {
      return `https://www.threads.net/intent/post?text=${encodeURIComponent(text)}`;
    }
    return null;
  }

  async function handleShare(platform) {
    const dict = T[currentLang];

    if (platform === 'copy') {
      try {
        await navigator.clipboard.writeText(getShareLink());
        showToast(dict.toastLinkCopied);
      } catch { showToast(dict.toastShareFailed); }
      shareWrap.classList.remove('open');
      return;
    }

    if (!state.previewData) {
      showToast(dict.toastNoImage);
      return;
    }

    if (platform === 'bluesky' || platform === 'x' || platform === 'threads') {
      const url = composeUrlFor(platform, dict);
      if (url) window.open(url, '_blank', 'noopener,noreferrer');
      shareWrap.classList.remove('open');
      (async () => {
        const blob = await getShareBlob();
        if (!blob) return;
        const copied = await copyImageToClipboardSafe(blob);
        if (copied) {
          showToast(dict.toastImageCopied);
        } else {
          downloadBlob(blob, 'inversion.png');
          showToast(dict.toastImageDownloaded);
        }
      })();
      return;
    }

    const text = dict.shareText(VERSION, getShareLink());
    const blob = await getShareBlob();
    const file = blob ? new File([blob], 'inversion.png', { type: 'image/png' }) : null;

    if (platform === 'native' || platform === 'instagram') {
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], text, title: 'Applied Inversion' });
          shareWrap.classList.remove('open');
          return;
        } catch (err) {
          if (err && (err.name === 'AbortError' || err.name === 'NotAllowedError')) {
            shareWrap.classList.remove('open');
            return;
          }
        }
      }
      if (platform === 'instagram') {
        if (blob) downloadBlob(blob, 'inversion.png');
        window.open('https://www.instagram.com/', '_blank', 'noopener,noreferrer');
        showToast(dict.toastInstagramDesktop);
      } else {
        try {
          await navigator.clipboard.writeText(getShareLink());
          showToast(dict.toastLinkCopied);
        } catch { showToast(dict.toastShareFailed); }
      }
      shareWrap.classList.remove('open');
    }
  }

  document.querySelectorAll('[data-share]').forEach((btn) => {
    btn.addEventListener('click', () => handleShare(btn.dataset.share));
  });

  applyHashToControls(getHashParams());
  syncFillColorEnabled();
  initLang();
  initWorker();
  suppressHashWrite = false;

  (async () => {
    try {
      const saved = await idbGet('lastImage');
      if (saved && saved.blob && !state.previewData) {
        loadImage(saved.blob, { skipPersist: true });
      }
    } catch {}
  })();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
