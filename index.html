<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Inversion Tool</title>
<style>
  :root {
    --bg: #111418;
    --panel: #1a1f25;
    --border: #2a323c;
    --text: #e6edf3;
    --muted: #8b97a3;
    --accent: #4aa3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-left: auto;
  }
  button, select, input[type="file"]::file-selector-button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { border-color: var(--accent); }
  button.primary {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    font-weight: 600;
  }
  input[type="file"] {
    color: var(--muted);
    font-size: 13px;
  }
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 16px;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .panel h2 {
    margin: 0 0 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .canvas-wrap {
    position: relative;
    width: 100%;
    background: #0a0d11;
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 200px;
  }
  canvas {
    display: block;
    max-width: 100%;
    height: auto;
    touch-action: none;
  }
  #leftCanvas { cursor: crosshair; }
  .controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 12px;
  }
  @media (max-width: 600px) {
    .controls { grid-template-columns: 1fr; }
  }
  .control {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .control label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .control input[type="number"] {
    background: #0a0d11;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 5px;
    font-family: inherit;
    font-size: 13px;
    width: 100%;
  }
  .fill-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .fill-row label { font-size: 12px; color: var(--muted); }
  .fill-row select {
    padding: 6px 8px;
    border-radius: 5px;
    font-size: 13px;
  }
  .fill-row input[type="color"] {
    width: 36px;
    height: 30px;
    padding: 0;
    border: 1px solid var(--border);
    background: transparent;
    border-radius: 5px;
    cursor: pointer;
  }
  .hint {
    color: var(--muted);
    font-size: 12px;
    margin-top: 10px;
    line-height: 1.5;
  }
  .empty-msg {
    color: var(--muted);
    font-size: 13px;
    padding: 40px;
    text-align: center;
  }
</style>
</head>
<body>
<header>
  <h1>Image Inversion</h1>
  <div class="toolbar">
    <input type="file" id="fileInput" accept="image/*">
    <select id="formatSelect" title="Save format">
      <option value="image/png">PNG</option>
      <option value="image/jpeg">JPEG</option>
      <option value="image/webp">WEBP</option>
    </select>
    <button id="saveBtn" class="primary">저장</button>
  </div>
</header>

<main>
  <section class="panel">
    <h2>원본 / 반전원</h2>
    <div class="canvas-wrap" id="leftWrap">
      <div class="empty-msg" id="leftEmpty">이미지를 업로드해 주세요</div>
      <canvas id="leftCanvas" style="display:none"></canvas>
    </div>
    <div class="controls">
      <div class="control">
        <label for="cxInput">중심 X (%)</label>
        <input type="number" id="cxInput" min="0" max="100" step="0.1" value="50">
      </div>
      <div class="control">
        <label for="cyInput">중심 Y (%)</label>
        <input type="number" id="cyInput" min="0" max="100" step="0.1" value="50">
      </div>
      <div class="control">
        <label for="rInput">반지름 (px)</label>
        <input type="number" id="rInput" min="1" step="1" value="100">
      </div>
    </div>
    <div class="fill-row">
      <label for="fillMode">정보 없는 영역</label>
      <select id="fillMode">
        <option value="black">검정</option>
        <option value="white">흰색</option>
        <option value="custom">사용자 색</option>
        <option value="transparent">투명</option>
      </select>
      <input type="color" id="fillColor" value="#000000">
    </div>
    <div class="hint">
      이미지 위를 클릭/탭하면 중심점이 이동합니다. 중심점을 드래그하면 위치를, 점선 경계를 드래그하면 반지름을 조절할 수 있어요.
    </div>
  </section>

  <section class="panel">
    <h2>반전 결과</h2>
    <div class="canvas-wrap" id="rightWrap">
      <div class="empty-msg" id="rightEmpty">결과가 여기에 표시됩니다</div>
      <canvas id="rightCanvas" style="display:none"></canvas>
    </div>
    <div class="hint">
      반전(inversion): 중심 O, 반지름 r의 원에 대해 점 Q를 OP·OQ = r²을 만족하는 P로 매핑합니다.
    </div>
  </section>
</main>

<script>
(() => {
  const fileInput = document.getElementById('fileInput');
  const saveBtn = document.getElementById('saveBtn');
  const formatSelect = document.getElementById('formatSelect');
  const leftCanvas = document.getElementById('leftCanvas');
  const rightCanvas = document.getElementById('rightCanvas');
  const leftEmpty = document.getElementById('leftEmpty');
  const rightEmpty = document.getElementById('rightEmpty');
  const cxInput = document.getElementById('cxInput');
  const cyInput = document.getElementById('cyInput');
  const rInput = document.getElementById('rInput');
  const fillMode = document.getElementById('fillMode');
  const fillColor = document.getElementById('fillColor');

  const lctx = leftCanvas.getContext('2d');
  const rctx = rightCanvas.getContext('2d', { willReadFrequently: true });

  const MAX_DIM = 900;

  const state = {
    img: null,
    srcCanvas: null,
    srcData: null,
    w: 0,
    h: 0,
    cx: 0,
    cy: 0,
    r: 0,
    dragMode: null,
  };

  function fitDimensions(w, h) {
    const m = Math.max(w, h);
    if (m <= MAX_DIM) return { w, h };
    const s = MAX_DIM / m;
    return { w: Math.round(w * s), h: Math.round(h * s) };
  }

  function loadImage(file) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const { w, h } = fitDimensions(img.naturalWidth, img.naturalHeight);
      state.img = img;
      state.w = w;
      state.h = h;
      leftCanvas.width = rightCanvas.width = w;
      leftCanvas.height = rightCanvas.height = h;

      const src = document.createElement('canvas');
      src.width = w;
      src.height = h;
      const sctx = src.getContext('2d');
      sctx.drawImage(img, 0, 0, w, h);
      state.srcCanvas = src;
      state.srcData = sctx.getImageData(0, 0, w, h);

      state.cx = w / 2;
      state.cy = h / 2;
      state.r = Math.min(w, h) * 0.3;

      leftCanvas.style.display = 'block';
      rightCanvas.style.display = 'block';
      leftEmpty.style.display = 'none';
      rightEmpty.style.display = 'none';

      updateInputs();
      render();
    };
    img.src = url;
  }

  function updateInputs() {
    cxInput.value = (state.cx / state.w * 100).toFixed(2);
    cyInput.value = (state.cy / state.h * 100).toFixed(2);
    rInput.value = Math.round(state.r);
    rInput.max = Math.max(state.w, state.h) * 2;
  }

  function drawOverlay() {
    lctx.drawImage(state.srcCanvas, 0, 0);
    lctx.save();
    lctx.setLineDash([6, 6]);
    lctx.lineWidth = 2;
    lctx.strokeStyle = 'rgba(255,255,255,0.95)';
    lctx.beginPath();
    lctx.arc(state.cx, state.cy, state.r, 0, Math.PI * 2);
    lctx.stroke();
    lctx.strokeStyle = 'rgba(0,0,0,0.6)';
    lctx.setLineDash([6, 6]);
    lctx.lineDashOffset = 6;
    lctx.beginPath();
    lctx.arc(state.cx, state.cy, state.r, 0, Math.PI * 2);
    lctx.stroke();
    lctx.restore();

    lctx.save();
    lctx.fillStyle = 'rgba(74,163,255,0.95)';
    lctx.strokeStyle = '#fff';
    lctx.lineWidth = 2;
    lctx.beginPath();
    lctx.arc(state.cx, state.cy, 6, 0, Math.PI * 2);
    lctx.fill();
    lctx.stroke();
    lctx.restore();
  }

  function parseFill() {
    const mode = fillMode.value;
    if (mode === 'transparent') return [0, 0, 0, 0];
    if (mode === 'black') return [0, 0, 0, 255];
    if (mode === 'white') return [255, 255, 255, 255];
    const hex = fillColor.value;
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return [r, g, b, 255];
  }

  function renderInversion() {
    const w = state.w, h = state.h;
    const src = state.srcData.data;
    const out = rctx.createImageData(w, h);
    const dst = out.data;
    const cx = state.cx, cy = state.cy;
    const r = state.r;
    const r2 = r * r;
    const [fr, fg, fb, fa] = parseFill();

    for (let y = 0; y < h; y++) {
      const dy = y - cy;
      const dy2 = dy * dy;
      const rowOut = y * w * 4;
      for (let x = 0; x < w; x++) {
        const dx = x - cx;
        const d2 = dx * dx + dy2;
        const o = rowOut + x * 4;
        if (d2 < 0.5) {
          dst[o] = fr; dst[o+1] = fg; dst[o+2] = fb; dst[o+3] = fa;
          continue;
        }
        const k = r2 / d2;
        const sx = cx + dx * k;
        const sy = cy + dy * k;
        const ix = sx | 0;
        const iy = sy | 0;
        if (ix < 0 || iy < 0 || ix >= w || iy >= h) {
          dst[o] = fr; dst[o+1] = fg; dst[o+2] = fb; dst[o+3] = fa;
          continue;
        }
        const si = (iy * w + ix) * 4;
        dst[o] = src[si];
        dst[o+1] = src[si+1];
        dst[o+2] = src[si+2];
        dst[o+3] = src[si+3];
      }
    }
    rctx.putImageData(out, 0, 0);
  }

  let renderRaf = 0;
  function render() {
    if (!state.srcData) return;
    drawOverlay();
    if (renderRaf) cancelAnimationFrame(renderRaf);
    renderRaf = requestAnimationFrame(() => {
      renderRaf = 0;
      renderInversion();
    });
  }

  function canvasCoords(evt) {
    const rect = leftCanvas.getBoundingClientRect();
    const sx = leftCanvas.width / rect.width;
    const sy = leftCanvas.height / rect.height;
    const cx = (evt.clientX - rect.left) * sx;
    const cy = (evt.clientY - rect.top) * sy;
    return { x: cx, y: cy };
  }

  function hitTest(x, y) {
    const dx = x - state.cx;
    const dy = y - state.cy;
    const d = Math.hypot(dx, dy);
    const edgeTol = Math.max(8, state.r * 0.05);
    const centerTol = 12;
    if (d <= centerTol) return 'center';
    if (Math.abs(d - state.r) <= edgeTol) return 'edge';
    return 'move';
  }

  leftCanvas.addEventListener('pointerdown', (e) => {
    if (!state.srcData) return;
    leftCanvas.setPointerCapture(e.pointerId);
    const { x, y } = canvasCoords(e);
    const hit = hitTest(x, y);
    if (hit === 'edge') {
      state.dragMode = 'resize';
    } else if (hit === 'center') {
      state.dragMode = 'move';
    } else {
      state.cx = clamp(x, 0, state.w);
      state.cy = clamp(y, 0, state.h);
      state.dragMode = 'move';
      updateInputs();
      render();
    }
  });

  leftCanvas.addEventListener('pointermove', (e) => {
    if (!state.srcData) return;
    const { x, y } = canvasCoords(e);
    if (!state.dragMode) {
      const hit = hitTest(x, y);
      leftCanvas.style.cursor =
        hit === 'edge' ? 'nwse-resize' :
        hit === 'center' ? 'grab' : 'crosshair';
      return;
    }
    if (state.dragMode === 'move') {
      state.cx = clamp(x, 0, state.w);
      state.cy = clamp(y, 0, state.h);
    } else if (state.dragMode === 'resize') {
      state.r = Math.max(1, Math.hypot(x - state.cx, y - state.cy));
    }
    updateInputs();
    render();
  });

  const endDrag = (e) => {
    if (state.dragMode) {
      state.dragMode = null;
      try { leftCanvas.releasePointerCapture(e.pointerId); } catch {}
    }
  };
  leftCanvas.addEventListener('pointerup', endDrag);
  leftCanvas.addEventListener('pointercancel', endDrag);

  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  cxInput.addEventListener('input', () => {
    if (!state.srcData) return;
    const v = parseFloat(cxInput.value);
    if (!isNaN(v)) {
      state.cx = clamp(v / 100 * state.w, 0, state.w);
      render();
    }
  });
  cyInput.addEventListener('input', () => {
    if (!state.srcData) return;
    const v = parseFloat(cyInput.value);
    if (!isNaN(v)) {
      state.cy = clamp(v / 100 * state.h, 0, state.h);
      render();
    }
  });
  rInput.addEventListener('input', () => {
    if (!state.srcData) return;
    const v = parseFloat(rInput.value);
    if (!isNaN(v) && v > 0) {
      state.r = v;
      render();
    }
  });

  fillMode.addEventListener('change', render);
  fillColor.addEventListener('input', () => {
    if (fillMode.value === 'custom') render();
  });

  fileInput.addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) loadImage(f);
  });

  saveBtn.addEventListener('click', () => {
    if (!state.srcData) return;
    const type = formatSelect.value;
    const ext = type === 'image/jpeg' ? 'jpg' : type === 'image/webp' ? 'webp' : 'png';
    let outCanvas = rightCanvas;
    if (type === 'image/jpeg') {
      const tmp = document.createElement('canvas');
      tmp.width = rightCanvas.width;
      tmp.height = rightCanvas.height;
      const tctx = tmp.getContext('2d');
      tctx.fillStyle = '#ffffff';
      tctx.fillRect(0, 0, tmp.width, tmp.height);
      tctx.drawImage(rightCanvas, 0, 0);
      outCanvas = tmp;
    }
    outCanvas.toBlob((blob) => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `inversion.${ext}`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, type, 0.95);
  });
})();
</script>
</body>
</html>
